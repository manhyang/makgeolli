:root{--bg:#f4f6f8;--card:#ffffff;--ink:#16191d;--sub:#6b7380;--line:#e7eaee;--acc:#17876d;--acc2:#1fa383;--tint:#e6f4f0;--ok:#17876d;--bad:#d9534f;--badtint:#fdecec;--chip:#f0f2f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.01em;font-size:16px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:640px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:24px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top .grow{flex:1}
.card{background:var(--card);border:0;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
.bcard{cursor:pointer}
.bcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bcard .name{font-weight:700;font-size:17px}
.badge{display:inline-block;background:var(--chip);color:var(--sub);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--tint);color:var(--ok)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--chip);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(23,135,109,.25)}
.btn:active{transform:scale(.98)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #f3c9c7}
.btn.block{width:100%;padding:13px;margin-top:6px}
.btn.sm{padding:6px 10px;font-size:13px}
label.f{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fafbfc;color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--tint)}
input:disabled{color:var(--sub)}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3e{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 6px}
.grid3e input{padding:10px 7px;font-size:15px}
.grid3e .unit input{padding-right:24px}
.grid3e .unit span{right:6px;font-size:12px}
.grid3{display:grid;grid-template-columns:1.2fr .9fr 1fr;gap:0 6px}
.grid3 input[type=date]::-webkit-calendar-picker-indicator{display:none}
.grid3 input[type=date]{font-size:14px}
.grid3 input{padding:10px 7px;font-size:15px}
.grid3 .unit input{padding-right:24px}
.grid3 .unit span{right:6px;font-size:12px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.seg button{white-space:nowrap}
.seg.ratio{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.seg.ratio button{font-size:12px;padding:9px 0;letter-spacing:-.04em}
.unit{position:relative}
.unit input{padding-right:38px}
.unit span{position:absolute;right:10px;bottom:10px;color:var(--sub);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:#fafbfc;color:var(--ink);border-radius:11px;padding:9px 0;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline}
.gap{color:var(--sub);font-size:12px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sum>div{background:var(--chip);border-radius:12px;padding:8px 8px;min-width:0}
.sum b{display:block;font-size:15px;letter-spacing:-.03em;line-height:1.3;margin:1px 0;word-break:keep-all}
.sum small{display:block;color:var(--sub);font-size:11px;line-height:1.35;letter-spacing:-.02em;word-break:keep-all}
.tl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tl:first-of-type{border-top:0}
.score{font-size:22px;font-weight:800;color:var(--acc)}
.qitem{border-top:1px solid var(--line);padding:10px 0}
.qitem:first-child{border-top:0}
.qh{display:flex;justify-content:space-between;font-weight:600}
.qh small{color:var(--sub);font-weight:400}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.dots button{border:1px solid var(--line);background:#fafbfc;color:var(--ink);border-radius:11px;padding:8px 0;font:inherit;font-weight:700;cursor:pointer}
.dots button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.desc{font-size:13px;color:var(--sub);min-height:20px}
.prof{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px;padding:5px 0}
.prof input{padding:0;border:0;accent-color:var(--acc)}
.prof .v{font-size:13px;color:var(--sub);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{background:#fafbfc;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;user-select:none}
.chips input{display:none}
.chips label.on{background:var(--tint);border-color:var(--acc);color:var(--acc);font-weight:700}
.chips.off label.on{background:var(--badtint);border-color:var(--bad);color:var(--bad)}
.total{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#17876d,#2bb08c);color:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(23,135,109,.25);padding:14px 16px;margin-bottom:12px;position:sticky;top:6px;z-index:5}
.total b{font-size:28px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.warn{background:#fff8e6;border:0;border-radius:14px;color:#7a5a00;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16191d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90%}
.toast.show{opacity:1}
.guide table{width:100%;border-collapse:collapse;font-size:13px}
.guide td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.guide td:first-child{width:28px;font-weight:700;color:var(--acc)}
/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.savebar .btn{padding:11px 20px}
.savebar .grow{flex:1;min-width:0;text-align:center;font-size:12px}
.btn.navbtn{padding:10px 16px;font-size:15px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.savebar .btn.navbtn{padding:11px 14px}
.savebar.dirty .btn{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(23,135,109,.45)}50%{box-shadow:0 0 0 8px rgba(23,135,109,0)}}
/* fold */
details.fold>summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:400}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary .stage-h::after{content:'›';font-size:22px;color:var(--sub);transition:transform .2s;margin-left:8px}
details.fold[open]>summary .stage-h::after{transform:rotate(90deg)}
details.fold>summary .stage-h{align-items:center}
details.fold>summary .stage-h .gap{flex:1;text-align:right}
.brief{font-size:13px;color:var(--sub);margin-top:2px}
details.fold[open] .brief{display:none}
details.fold[open]>summary{margin-bottom:6px}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--tint);color:var(--acc);font-size:12px}
/* hero & list */
.hero{background:linear-gradient(135deg,#17876d,#2bb08c 60%,#5cc8a8);color:#fff;border-radius:22px;padding:18px 16px 14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(23,135,109,.25)}
.hero-t{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero-s{font-size:12px;opacity:.85;margin-top:2px}
.mh{font-family:'MHBrush',serif;font-size:1.35em;font-weight:400;letter-spacing:.02em;background:linear-gradient(180deg,#fff7d6,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));margin-right:1px;vertical-align:-2px}
.hero-t2{font-size:15px;font-weight:600;opacity:.95;margin-top:-2px}
.ver{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:4px;letter-spacing:0}
.appfoot{text-align:center;color:var(--sub);font-size:11px;margin:18px 0 0}
.btn.ghost{background:rgba(255,255,255,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stats div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:20px;line-height:1.2}
.stats b span{font-size:12px;margin-left:1px}
.stats small{font-size:11px;opacity:.9}
.health{display:flex;align-items:center;gap:10px;background:#fff4f2;border-radius:18px;padding:10px;margin-bottom:12px}
.health img{width:88px;height:66px;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 10px rgba(16,24,40,.15);flex:none}
.health img.l{transform:rotate(-4deg)}
.health img.r{transform:rotate(4deg)}
.health .hcap{flex:1;color:#9b3b33;font-size:13px;text-align:center;line-height:1.4;min-width:0;word-break:keep-all}
.health .hcap span{font-size:11px;color:#b5675f}
.alerts{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);border:1.5px solid #ffd7a8}
.alerts .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.alerts .ah i{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:4px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;margin-top:6px;cursor:pointer;background:var(--chip)}
.arow span{font-size:12px;color:var(--sub)}
.arow em{font-style:normal;font-size:12px;font-weight:700;white-space:nowrap}
.over{background:#fdecec!important;color:#c0392b!important}
.today{background:#fff1d6!important;color:#b26a00!important}
.soon{background:#e8f1ff!important;color:#2f5fb3!important}
.later{background:var(--chip)!important;color:var(--sub)!important}
.arow.over em,.arow.today em{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.due{border-radius:12px;padding:4px 8px;text-align:center;min-width:58px}
.due small{display:block;font-size:10px}
.due b{display:block;font-size:14px;line-height:1.3}
.steps span.plan{background:#fff;border:1px dashed var(--line)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:middle}
.donerow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--chip);border-radius:12px;padding:8px 10px;margin-bottom:4px;font-size:13px;color:var(--sub)}
.donerow.is{background:var(--tint);color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:22px;padding:20px 18px;width:100%;max-width:380px;text-align:center}
.mbox h3{margin:4px 0 12px;font-size:18px}
.bell{font-size:40px;animation:ring 1s ease-in-out infinite;display:inline-block}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.mrow{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.mrow span{font-size:12px}
.mrow em{font-style:normal;font-weight:800;white-space:nowrap}
.sortbar{display:flex;align-items:center;gap:6px;margin:0 2px 10px;font-size:13px;color:var(--sub)}
.sortbar span{margin-right:2px}
.sortbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.sortbar button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.rec{background:#fff;border-radius:14px;padding:12px;margin-top:12px;border:1px solid #ebe0c4}
.rh{font-weight:800;margin-bottom:8px}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:10px}
.rgrid div{background:var(--tint);border-radius:10px;padding:6px 4px;text-align:center}
.rgrid small{display:block;font-size:10.5px;color:var(--acc)}
.rgrid b{font-size:14px;color:var(--acc);letter-spacing:-.03em}
.rpred{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:8px}
.rpred span{display:grid;grid-template-columns:52px 1fr;align-items:center;font-size:12px;color:var(--sub)}
.rpred i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#9edbc8,var(--acc))}
.rec ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.rec li{margin:3px 0}
.askc{margin-top:14px;border-top:1px solid #ebe0c4;padding-top:12px}
.askh{font-weight:700;margin-bottom:6px;cursor:pointer}
details.askc:not([open]) .askh{margin-bottom:0}.askh span{font-weight:400;font-size:12px;color:var(--sub)}
.bigstep{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px}
.bigstep b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.12);font-size:13px}
.btn.pri.bigstep b{background:rgba(255,255,255,.25)}
.aiprev{font-size:12.5px;color:var(--sub);margin:6px 2px 4px;min-height:4px}
.aiprev.ok{color:var(--acc)}
.hint{font-size:12px;margin:6px 2px 8px;line-height:1.5}
.tgt .tgh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tgt .tgh span{font-size:12px;color:var(--sub)}
.tgtxt{margin:6px 0 2px;font-size:15px;font-weight:600;color:#7a5b16}
.tgrows{margin-top:8px}
.tgr{display:grid;grid-template-columns:48px 1fr 74px;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.tgbar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#efe6cf,#e2d3a8)}
.tgbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%}
i.goal{background:#fff;border:3px solid #c9a227;box-sizing:border-box}

<script>
const KEY='makgeolli_log_v1';

const QUALITY=[
 {k:'look',n:'외관 (색·탁도)',w:10,d:['','탁하고 변색·이물감이 있음','색이 칙칙하거나 층 분리가 심함','무난한 색과 탁도','맑은 미색, 탁도가 고름','윤기 있는 고운 미색, 균일하고 깔끔함']},
 {k:'aroma',n:'향',w:20,d:['','이취가 뚜렷함','향이 약하거나 거슬리는 냄새가 조금 있음','무난한 쌀·누룩 향','과일·꽃 향이 느껴지고 깔끔함','풍부하고 복합적인 향, 이취 없음']},
 {k:'balance',n:'맛의 조화',w:25,d:['','한 가지 맛이 지나치게 튐 (너무 시거나 쓰거나 닮)','균형이 다소 깨짐','무난함','단맛·신맛·쓴맛이 잘 어울림','모든 맛이 조화롭고 입체적']},
 {k:'texture',n:'질감·목넘김',w:15,d:['','거칠고 걸리며 화끈거림','약간 거칠거나 너무 묽음','무난함','부드럽게 넘어감','매끄럽고 크리미하며 무게감이 적당함']},
 {k:'finish',n:'여운',w:10,d:['','불쾌한 뒷맛이 남음','짧고 밋밋하거나 쓴 뒷맛','무난함','기분 좋은 뒷맛이 남음','길고 깔끔한 여운']},
 {k:'overall',n:'종합 선호도',w:20,d:['','다시 마시고 싶지 않음','아쉬움이 큼','괜찮음','또 마시고 싶음','남에게 자랑하고 싶음']}
];
const AROMAS=['사과·배 같은 과일향','바나나향','꽃향','쌀·곡물향','누룩향','요구르트(유산)향','꿀 같은 단향'];

let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.batches)){s.settings=s.settings||{email:DEFAULT_EMAIL};return s}}catch(e){}
  return {batches:[],settings:{email:DEFAULT_EMAIL},lastBackup:null};
}
let DIRTY=false,LASTSAVE=null;
function save(){DIRTY=false;LASTSAVE=new Date();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('⚠️ 저장 실패 — 바로 백업해 주세요')}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const num=v=>(v===''||v==null||isNaN(v))?0:Number(v);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
function days(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/864e5)}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(typeof a[ks[i]]!=='object'||a[ks[i]]===null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function batchById(id){return state.batches.find(b=>b.id===id)}
function activeStages(b){return STAGES.slice(0,COUNT[b.type]||1)}

function calc(b){
  const r={chap:0,mep:0,bottle:0,tap:0,mak:0,nuruk:0,ipguk:0};
  activeStages(b).forEach(s=>{const x=b.stages[s.k]||{};r.chap+=num(x.chap);r.mep+=num(x.mep);r.bottle+=num(x.bottle);r.tap+=num(x.tap);r.mak+=num(x.mak);r.nuruk+=num(x.nuruk);r.ipguk+=num(x.ipguk)});
  r.rice=r.chap+r.mep;r.water=r.bottle+r.tap+r.mak; // 막걸리도 물 양에 합산
  r.ratio=r.rice?r.water/r.rice*100:null;
  r.yield=num(b.chaeju&&b.chaeju.amount);
  r.dil=num(b.chaeju&&b.chaeju.water);
  r.orig=num(b.chaeju&&b.chaeju.orig)||(r.yield&&r.dil?r.yield-r.dil:null);
  r.abv1=num(b.chaeju&&b.chaeju.abvBefore)||null;r.abv2=num(b.chaeju&&b.chaeju.abvAfter)||null;
  r.abvExp=r.abv1&&r.orig>0?r.abv1*r.orig/r.yield:null;
  const br=k=>[...new Set(activeStages(b).map(s=>((b.stages[s.k]||{})[k]||'').trim()).filter(Boolean))].join(', ');
  r.brands={bottle:br('bottleBrand'),nuruk:br('nurukBrand'),ipguk:br('ipgukBrand')};
  r.perKg=r.rice&&r.yield?r.yield/r.rice:null; // L per kg == ml per g
  r.perKgOrig=r.rice&&r.orig?r.orig/r.rice:null;
  const start=b.stages.mit&&b.stages.mit.date;
  r.start=start;r.ferment=b.chaeju&&b.chaeju.done&&b.chaeju.date?days(start,b.chaeju.date):null;
  return r;
}
function tScore(t){
  let s=0,n=0;QUALITY.forEach(q=>{const v=t.quality&&t.quality[q.k];if(v){s+=v/5*q.w;n++}});
  return {score:Math.round(s),filled:n,done:n===QUALITY.length};
}
function grade(s){return s>=90?'최상':s>=80?'우수':s>=70?'양호':s>=60?'보통':'개선 필요'}

function isoD(d){d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return isoD(d)}
function addMonths(s,n){const d=new Date(s+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return isoD(d)}
function stepList(b){return [...activeStages(b).map(s=>({k:s.k,n:s.n,x:b.stages[s.k]=b.stages[s.k]||{}})),{k:'chaeju',n:'채주',x:b.chaeju=b.chaeju||{}}]}
const isDone=x=>!!(x&&x.done);
/* 채주 기간: 지금까지 채주 완료한 술들의 '마지막 덧술(또는 밑술) → 채주' 평균 일수. 같은 종류 기록이 있으면 그 평균, 없으면 전체 평균, 기록이 없으면 1달 */
function chaejuStat(b){
  const smp=t=>state.batches.filter(o=>o!==b&&(!t||o.type===t)&&isDone(o.chaeju)&&o.chaeju.date).map(o=>{const ks=activeStages(o);const last=o.stages[ks[ks.length-1].k];return last&&last.date?days(last.date,o.chaeju.date):null}).filter(v=>v!=null&&v>0);
  let a=smp(b.type),scope=b.type;if(!a.length){a=smp(null);scope='전체'}
  if(!a.length)return null;
  return {days:Math.round(a.reduce((x,y)=>x+y,0)/a.length),n:a.length,scope};
}
function cascade(b){
  let prev=null;
  stepList(b).forEach((st,i)=>{const x=st.x;
    if(i>0&&prev&&!x.done&&(x.autoDate!==false||!x.date)){if(st.k==='chaeju'){const cs=chaejuStat(b);x.date=cs?addDays(prev,cs.days):addMonths(prev,1)}else x.date=addDays(prev,7);x.autoDate=true}
    if(x.done===undefined)x.done=false;
    if(x.date)prev=x.date});
}
function nextTask(b){for(const st of stepList(b)){if(!isDone(st.x))return {k:st.k,n:st.n,date:st.x.date||null,diff:st.x.date?days(today(),st.x.date):null}}return null}
function dueLabel(diff){return diff==null?'일정 미정':diff>0?`D-${diff}`:diff===0?'오늘!':`${-diff}일 지남`}
function dueCls(diff){return diff==null?'':diff<0?'over':diff===0?'today':diff<=2?'soon':'later'}
function toggleDone(k){const x=k==='chaeju'?CUR.chaeju:CUR.stages[k];
  if(!x.done){x.done=true;if(!x.date||x.date>today()){x.date=today();x.autoDate=false}FOLD[CUR.id+':'+k]=false;const nt=nextTask(CUR);if(nt)FOLD[CUR.id+':'+nt.k]=true}
  else x.done=false;
  touch();rerenderKeep();toast(x.done?'완료 처리했어요 ✓':'완료를 취소했어요')}
/* 기존 기록 이전: 날짜가 오늘 이전이면 완료로 */
(function(){if((state.settings.doneVer||0)<1){state.batches.forEach(b=>{stepList(b).forEach(st=>{if(st.x.done===undefined)st.x.done=!!(st.x.date&&st.x.date<=today())});cascade(b)});state.settings.doneVer=1;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}})();
/* ---------- 캘린더(.ics) 알람 ---------- */
function icsEsc(t){return String(t).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function buildIcs(list){
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let ev='';list.forEach(({b,step})=>{const d=step.x.date.replace(/-/g,''),d2=addDays(step.x.date,1).replace(/-/g,'');
    ev+=`BEGIN:VEVENT\r\nUID:${b.id}-${step.k}@makgeolli\r\nDTSTAMP:${st}\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${d2}\r\nSUMMARY:${icsEsc('🍶 '+step.n+' - '+b.name)}\r\nDESCRIPTION:${icsEsc(APP_NAME)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(step.n+' 하는 날이에요')}\r\nTRIGGER:PT9H\r\nEND:VALARM\r\nEND:VEVENT\r\n`});
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//makgeolli//KO\r\nCALSCALE:GREGORIAN\r\n${ev}END:VCALENDAR\r\n`;
}
function exportIcs(bid){
  const bs=bid?[batchById(bid)]:state.batches;const list=[];
  bs.forEach(b=>stepList(b).forEach(step=>{if(!step.x.done&&step.x.date&&step.x.date>=today())list.push({b,step})}));
  if(!list.length){toast('등록할 예정 일정이 없어요');return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildIcs(list)],{type:'text/calendar'}));a.download=(bid?bs[0].name:'막걸리')+'_일정.ics';document.body.appendChild(a);a.click();a.remove();toast(`일정 ${list.length}개 파일을 만들었어요. 열어서 캘린더에 추가하세요`)}catch(e){toast('파일 만들기 실패')}
}
/* ---------- 앱 열 때 알람 ---------- */
let ALERTED=false;
function dueTasks(){return state.batches.map(b=>({b,t:nextTask(b)})).filter(x=>x.t&&x.t.diff!=null).sort((a,c)=>a.t.diff-c.t.diff)}
function showAlarm(){
  if(ALERTED)return;ALERTED=true;
  const due=dueTasks().filter(x=>x.t.diff<=0);if(!due.length)return;
  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,250])}catch(e){}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox"><div class="bell">🔔</div><h3>술 빚을 때가 됐어요!</h3>${due.map(x=>`<div class="mrow ${dueCls(x.t.diff)}" data-b="${x.b.id}"><div><b>${esc(x.b.name)}</b><br><span>${x.t.n} · ${x.t.date.slice(5).replace('-','/')}</span></div><em>${dueLabel(x.t.diff)}</em></div>`).join('')}<button class="btn pri block" id="mok">확인</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{const r=e.target.closest('.mrow');if(r){m.remove();go('b-'+r.dataset.b)}else if(e.target.id==='mok'||e.target===m)m.remove()});
}
function route(){
  const h=location.hash.slice(1);
  if(DIRTY&&!(h.startsWith('b-')||h.startsWith('t-')||h==='guide')){
    if(confirm('저장하지 않은 내용이 있어요.\n\n[확인] 저장하고 나가기\n[취소] 저장하지 않고 나가기')){save();toast('저장했어요 ✓')}
    else{state=load();DIRTY=false;CUR=null;CT=null;toast('변경 내용을 버렸어요')}
  }
  if(h.startsWith('b-')){const b=batchById(h.slice(2));return b?renderBatch(b):go('list')}
  if(h.startsWith('t-')){const[,bid,tid]=h.split('-');const b=batchById(bid);const t=b&&b.tastings.find(x=>x.id===tid);return t?renderTasting(b,t):go('list')}
  if(h==='backup')return renderBackup();
  if(h==='guide')return renderGuide();
  renderList();
}

  const dkey=x=>(x.stages.mit&&x.stages.mit.date)||x.created.slice(0,10);
  const skey=x=>{const sc=x.tastings.map(tScore).filter(t=>t.done).map(t=>t.score);return sc.length?Math.max(...sc):null};
  const bs=[...state.batches].sort((a,b)=>{
    if(so.by==='score'){const A=skey(a),B=skey(b);if(A==null&&B==null)return dkey(b).localeCompare(dkey(a));if(A==null)return 1;if(B==null)return -1;return so.dir*(A-B)||dkey(b).localeCompare(dkey(a))}

  ${location.protocol==='content:'?`<div class="warn"><b>⚠️ 임시 주소로 열려 있어요</b><br>지금 주소(content://)는 시간이 지나면 끊겨서 "파일에 액세스할 수 없음"이 뜨고, 기록이 안 보일 수 있어요.<br>① 먼저 <b>백업</b>을 해 두고 ② Chrome 주소창에 <b>file:///sdcard/Download/makgeolli.html</b> 을 입력해 여세요. 그다음 백업 화면의 복원으로 기록을 옮기면 돼요.</div>`:''}

    <div class="steps${steps.length>5?' many':''}">${steps.map(x=>`<span class="${x.on?'on':''}${x.wait?' wait '+(x.cls||''):''}${x.plan?' plan':''}">${x.n}${x.sub?`<em>${x.sub}</em>`:''}</span>`).join('<i></i>')}</div>

  ${list.map(x=>`<div class="arow ${dueCls(x.t.diff)}" onclick="go('b-${x.b.id}')"><div><b>${x.t.n}</b> <span>${esc(x.b.name)}</span></div><em>${dueLabel(x.t.diff)} · ${x.t.date.slice(5).replace('-','/')}</em></div>`).join('')}

  toast(b.locked?'🔒 잠갔어요. 실수로 고치거나 지울 수 없어요':'🔓 잠금을 풀었어요');
  route();
}
function applyLock(b){
  if(!b||!b.locked)return;
  document.querySelectorAll('#app input,#app textarea,#app select').forEach(e=>e.disabled=true);
  document.querySelectorAll('#app button:not(.keep)').forEach(e=>e.disabled=true);
  const top=document.querySelector('#app .top');
  if(top&&!document.querySelector('.lockbar'))top.insertAdjacentHTML('afterend',`<div class="lockbar">🔒 잠긴 기록이에요. 보기만 할 수 있어요. <button class="btn sm keep" onclick="toggleLock('${b.id}')">잠금 해제</button></div>`);
}
function delBatch(){if(CUR.locked){toast('🔒 잠긴 기록은 지울 수 없어요');return}if(confirm('이 술 기록과 맛 평가를 모두 삭제할까요?')){state.batches=state.batches.filter(b=>b!==CUR);save();go('list')}}
function touch(){if(CUR&&CUR.locked)return;if(CUR)cascade(CUR);if(CUR&&isAuto(CUR)){CUR.name=autoName(CUR);const el=$('#nm');if(el&&document.activeElement!==el)el.value=CUR.name}CUR.updated=new Date().toISOString();DIRTY=true;updateSaveBar()}
function isAuto(b){return b.nameAuto===true||(b.nameAuto===undefined&&!b.name)}
function autoName(b){
  const d=b.stages.mit&&b.stages.mit.date;const m=d?d.slice(0,4)+'년 '+(+d.slice(5,7))+'월 ':'';
  let ch=0,me=0;activeStages(b).forEach(s=>{const x=b.stages[s.k]||{};ch+=num(x.chap);me+=num(x.mep)});
  const rk=ch&&me?'찹쌀·멥쌀':ch?'찹쌀':me?'멥쌀':(b.plan&&b.plan.riceKind==='chap'?'찹쌀':b.plan&&b.plan.riceKind==='mep'?'멥쌀':'');
  const base=TYPES.includes(b.type)?`${m}${rk?rk+' ':''}${b.type}`:`${m}새 술`;const used=new Set(state.batches.filter(x=>x!==b).map(x=>x.name));
  // 비율: 배합 계산기로 입력했으면 그 비율, 아니면 실제 입력한 쌀·물·가수량으로 계산
  const p=b.plan,c=calc(b);let ratio='';
  if(p&&p.applied&&p.water!==''&&p.dil!=='')ratio=` (${num(p.water)}:${num(p.dil)})`;
  else if(c.rice&&(c.water||c.dil))ratio=` (${Math.round(c.water/c.rice*100)}:${Math.round(c.dil/c.rice*100)})`;
  else if(p&&p.water!==''&&p.water!=null&&p.dil!==''&&p.dil!=null)ratio=` (${num(p.water)}:${num(p.dil)})`;
  let name=base+ratio,i=2;while(used.has(name))name=`${base} ${i++}${ratio}`;return name;
}

function restore(txt){

    list.forEach(nb=>{const i=state.batches.findIndex(b=>b.id===nb.id);

    save();toast(`복원 완료: 새 기록 ${add}건, 갱신 ${upd}건`);setTimeout(()=>go('list'),600);
  }catch(e){toast('백업 내용을 읽을 수 없어요. 전체가 복사됐는지 확인해 주세요')}
}

});
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
function saveBar(){return `<div class="savebar"><button class="btn navbtn keep" onclick="go('list')">☰ 목록</button><span id="saveSt" class="grow"></span><button class="btn pri" onclick="doSave()">💾 저장하기</button></div>`}
function updateSaveBar(){const el=$('#saveSt');if(!el)return;el.innerHTML=DIRTY?'<b style="color:var(--bad)">● 저장 안 된 변경</b>':(LASTSAVE?`✓ ${LASTSAVE.getHours()}:${String(LASTSAVE.getMinutes()).padStart(2,'0')} 저장됨`:'✓ 저장된 상태');el.parentElement.classList.toggle('dirty',DIRTY)}
function doSave(){save();updateSaveBar();toast('저장했어요 ✓')}
route();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
